@if (isVisible()) {
  <nav aria-label="Pagination" class="flex justify-center">
    <div class="join">
      <button
        type="button"
        class="btn btn-sm join-item"
        aria-label="Previous page"
        [disabled]="isPreviousDisabled()"
        (click)="previousPage()"
      >
        <shared-icon name="chevron-left" class="size-5" />
      </button>

      <!-- Phones get a position readout in place of the numbered pages. -->
      <span class="btn btn-sm join-item pointer-events-none sm:hidden">
        {{ currentPage() }} / {{ totalPages() }}
      </span>

      @for (page of pages(); track page.key) {
        @if (page.value === null) {
          <span class="btn btn-sm join-item btn-disabled hidden sm:inline-flex">
            ...
          </span>
        } @else {
          <button
            type="button"
            class="btn btn-sm join-item hidden sm:inline-flex"
            [class.btn-active]="page.value === currentPage()"
            [attr.aria-current]="page.value === currentPage() ? 'page' : null"
            [attr.aria-label]="'Page ' + page.value"
            (click)="changePage(page.value)"
          >
            {{ page.value }}
          </button>
        }
      }

      <button
        type="button"
        class="btn btn-sm join-item"
        aria-label="Next page"
        [disabled]="isNextDisabled()"
        (click)="nextPage()"
      >
        <shared-icon name="chevron-right" class="size-5" />
      </button>
    </div>
  </nav>
}
