<dialog class="modal modal-bottom sm:modal-middle modal-open">
  <div class="modal-box">
    <h3 [id]="titleId" class="text-lg font-bold">Quick Insert</h3>
    <p class="text-sm opacity-60">
      Writes the four punches of a standard working day.
    </p>

    <form [formGroup]="formGroup" (ngSubmit)="onSubmit()" novalidate>
      <div class="grid grid-cols-1 gap-x-4 pt-4 sm:grid-cols-2">
        <!-- #region Date -->
        <fieldset class="fieldset sm:col-span-2">
          <legend class="fieldset-legend">Date</legend>
          <input
            type="date"
            formControlName="date"
            class="input w-full"
            [class.input-error]="dateInvalid"
            [attr.aria-invalid]="dateInvalid ? 'true' : null"
            [attr.aria-describedby]="dateInvalid ? 'date-error' : null"
          />
          @if (dateInvalid) {
            <p id="date-error" class="label text-error">Date is required.</p>
          }
        </fieldset>
        <!-- #endregion -->

        <!-- #region The four punches -->
        @for (slot of slots; track slot.control) {
          <fieldset class="fieldset">
            <legend class="fieldset-legend">{{ slot.label }}</legend>

            <label
              class="input w-full"
              [class.input-error]="slotInvalid(slot.control)"
            >
              <input
                type="time"
                [formControlName]="slot.control"
                [attr.aria-invalid]="slotInvalid(slot.control) ? 'true' : null"
                [attr.aria-describedby]="
                  slotInvalid(slot.control) ? slot.control + '-error' : null
                "
              />
              <shared-entry-type-badge [type]="slot.type" />
            </label>

            @if (slotInvalid(slot.control)) {
              <p [id]="slot.control + '-error'" class="label text-error">
                {{ slot.label }} is required.
              </p>
            }
          </fieldset>
        }
        <!-- #endregion -->

        <!-- #region Note -->
        <fieldset class="fieldset sm:col-span-2">
          <legend class="fieldset-legend">Note</legend>
          <textarea
            formControlName="note"
            class="textarea w-full"
            rows="2"
            placeholder="Insert notes (optional)"
          ></textarea>
        </fieldset>
        <!-- #endregion -->
      </div>

      <!-- #region Buttons -->
      <div class="modal-action">
        <button
          type="button"
          class="btn btn-ghost"
          [disabled]="submitting()"
          (click)="cancel()"
        >
          Cancel
        </button>

        <button type="submit" class="btn btn-primary" [disabled]="submitting()">
          @if (submitting()) {
            <span class="loading loading-spinner" aria-hidden="true"></span>
          }
          Save
        </button>
      </div>
      <!-- #endregion -->
    </form>
  </div>
</dialog>
