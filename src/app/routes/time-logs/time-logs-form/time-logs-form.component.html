<div
  class="card card-sm sm:card-md bg-base-100 mx-auto w-full max-w-2xl shadow"
>
  <div class="card-body">
    <h1 class="card-title text-xl font-semibold">
      {{ isNew() ? "Add New" : "Edit" }} Time Log
    </h1>

    <div class="divider my-2"></div>

    <form
      [formGroup]="formGroup"
      (ngSubmit)="onSubmit()"
      class="space-y-4"
      novalidate
    >
      <!-- #region Timestamp -->
      <fieldset class="fieldset">
        <legend class="fieldset-legend">Timestamp</legend>
        <input
          type="datetime-local"
          formControlName="timestamp"
          class="input w-full"
          [class.input-error]="timestampInvalid"
          [attr.aria-invalid]="timestampInvalid ? 'true' : null"
          [attr.aria-describedby]="timestampInvalid ? 'timestamp-error' : null"
        />
        @if (timestampInvalid) {
          <p id="timestamp-error" class="label text-error">
            Timestamp is required.
          </p>
        }
      </fieldset>
      <!-- #endregion -->

      <!--#region Type-->
      <fieldset class="fieldset">
        <legend class="fieldset-legend">Type</legend>
        <select
          formControlName="type"
          class="select w-full"
          [class.select-error]="typeInvalid"
          [attr.aria-invalid]="typeInvalid ? 'true' : null"
          [attr.aria-describedby]="typeInvalid ? 'type-error' : null"
        >
          <option [ngValue]="null" disabled>Select the type</option>
          <option [ngValue]="'entry'">Entry</option>
          <option [ngValue]="'exit'">Exit</option>
        </select>
        @if (typeInvalid) {
          <p id="type-error" class="label text-error">Type is required.</p>
        }
      </fieldset>
      <!-- #endregion -->

      <!-- #region Note -->
      <fieldset class="fieldset">
        <legend class="fieldset-legend">Note</legend>
        <textarea
          formControlName="note"
          class="textarea w-full"
          rows="3"
          placeholder="Insert notes (optional)"
        ></textarea>
      </fieldset>
      <!-- #endregion -->

      <!-- #region Buttons -->
      <div class="card-actions justify-end">
        <a class="btn btn-ghost" routerLink="/time-logs">Cancel</a>
        <button type="submit" class="btn btn-primary" [disabled]="submitting()">
          @if (submitting()) {
            <span class="loading loading-spinner" aria-hidden="true"></span>
          }
          Save
        </button>
      </div>
      <!-- #endregion -->
    </form>
  </div>
</div>
